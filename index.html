<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Countdown</title>
<style>
body{font-family:Arial;background:#f5f3ff;padding:25px;text-align:center}
main{max-width:550px;margin:auto;background:white;padding:30px;border-radius:16px}
input{width:100%;padding:12px;box-sizing:border-box;margin:12px 0}
button{background:#7c3aed;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}
#result{font-size:25px;font-weight:bold;color:#6d28d9;margin:25px 0}
</style>
</head>
<body>
<main>
<h1>Event Countdown</h1>
<p>Set a future date for your event.</p>
<input id="event" placeholder="Event name">
<input id="date" type="datetime-local">
<button onclick="startCountdown()">Start Countdown</button>
<div id="result">No event selected.</div>
<p id="status"></p>
</main>
<script>
let interval=null;
function startCountdown(){
 clearInterval(interval);
 const name=document.getElementById("event").value.trim();
 const dateValue=document.getElementById("date").value;
 const result=document.getElementById("result");
 const status=document.getElementById("status");
 if(!name||!dateValue){
  status.textContent="Enter an event name and date.";
  return;
 }
 const target=new Date(dateValue).getTime();
 if(!Number.isFinite(target)||target<=Date.now()){
  status.textContent="Please select a valid future date.";
  result.textContent="Invalid event date.";
  return;
 }
 status.textContent="Countdown running for "+name;
 function update(){
  const diff=target-Date.now();
  if(diff<=0){
   result.textContent=name+" has started!";
   clearInterval(interval);
   return;
  }
  const days=Math.floor(diff/86400000);
  const hours=Math.floor(diff%86400000/3600000);
  const minutes=Math.floor(diff%3600000/60000);
  const seconds=Math.floor(diff%60000/1000);
  result.textContent=
  `${days} Days ${hours} Hours ${minutes} Minutes ${seconds} Seconds`;
 }
 update();
 interval=setInterval(update,1000);
}
</script>
</body>
</html>
